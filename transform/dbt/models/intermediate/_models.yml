version: 2

models:
  - name: int_rate_cycles
    description: >
      Quarterly policy rate with turning points marked. Turning points come from a centred
      four-quarter window on the level series, because the 2015 to 2019 tightening was slow
      enough that a change-based rule splits it into three runs.
    columns:
      - name: quarter_end
        tests: [unique, not_null]
      - name: rate_percent
        tests: [not_null]
      - name: rate_fraction
        tests: [not_null]

  - name: int_deposit_cost
    description: >
      Annualised cost of deposits per bank-quarter at the most precise tier the quarter
      supports, with the provenance of its numerator and denominator. Resolved by the
      `marketscope` library rather than in SQL, so the metric has one tested
      implementation (decision 0024). A bank-quarter that cannot be resolved at any tier is
      absent; one whose reconstruction failed the completeness check is present at tier X.
    columns:
      - name: cik
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'universe')
                field: cik
      - name: quarter_end
        tests: [not_null]
      - name: cost_of_deposits
        tests: [not_null]
      - name: metric_tier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1', '2', '3', 'X']
      - name: expense_provenance
        tests:
          - accepted_values:
              arguments:
                values: [reported, summed_components]
      - name: balance_provenance
        tests:
          - accepted_values:
              arguments:
                values: [reported, summed_components, derived_residual]
      - name: avg_method
        tests:
          - accepted_values:
              arguments:
                values: [endpoint, closing_only]
      - name: q4_derived
        description: >
          The deposit expense numerator, or any component of a reconstructed one, was
          derived as the fiscal year less the first nine months rather than reported.
        tests: [not_null]

  - name: int_fact_revisions
    description: >
      Every change of value for a us-gaap period across the filings that reported it, one
      row per change. A filing that repeats the value already published, as every
      comparative column does, is not a revision. Ordered by the precedence the panel
      applies, so the row marked current carries the value the metric uses and revision 1
      carries the value as first published (decision 0028).
    columns:
      - name: cik
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'universe')
                field: cik
      - name: tag
        tests: [not_null]
      - name: period_end
        tests: [not_null]
      - name: periodicity
        tests:
          - accepted_values:
              arguments:
                values: [instant, quarterly, semiannual, nine_month, annual, other]
      - name: revision_number
        tests: [not_null]
      - name: previous_value
        tests: [not_null]
      - name: revised_value
        tests: [not_null]
      - name: previous_filed
        tests: [not_null]
      - name: revised_filed
        tests: [not_null]
      - name: is_current
        description: The revised value is the one restatement precedence keeps for the period.
        tests: [not_null]

  - name: int_deposit_balances
    description: >
      Total, interest-bearing and non-interest-bearing deposits at every calendar quarter
      end a filer reports any of them, resolved by the library functions the cost of
      deposits uses. Present for quarters where no cost resolves, which is what the deposit
      step of an entity event needs.
    columns:
      - name: cik
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'universe')
                field: cik
      - name: quarter_end
        tests: [not_null]
      - name: interest_bearing_provenance
        tests:
          - accepted_values:
              arguments:
                values: [reported, summed_components, derived_residual]
      - name: noninterest_bearing_provenance
        tests:
          - accepted_values:
              arguments:
                values: [reported, summed_components]

  - name: int_regulatory_deposit_cost
    description: >
      Cost of deposits per regulatory group and quarter from Call Reports, summed across
      the group's insured institutions and computed by the library arithmetic the XBRL
      metric uses: quarterly expense annualised over the two-point average of
      interest-bearing deposits. Groups without an SEC registrant, First Republic, Signature
      and USAA, carry a null CIK.
    columns:
      - name: group_key
        tests: [not_null]
      - name: quarter_end
        tests: [not_null]
      - name: institutions
        tests: [not_null]
      - name: cost_of_deposits
        tests: [not_null]
      - name: avg_method
        tests:
          - accepted_values:
              arguments:
                values: [endpoint, closing_only]
