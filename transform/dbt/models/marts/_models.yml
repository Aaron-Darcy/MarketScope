version: 2

models:
  - name: dim_rate_cycle
    description: >
      One row per tightening cycle, derived from the policy rate rather than hardcoded, as
      specification section 2 requires. Named by recency so the study follows the series
      forward without anyone editing a window; earlier cycles are retained unnamed as
      context for how unusually fast the test cycle was.
    columns:
      - name: cycle_key
        tests: [unique, not_null]
      - name: cycle_name
        tests:
          - unique:
              config:
                where: "cycle_name is not null"
          - accepted_values:
              arguments:
                values: [calibration, test]
              config:
                where: "cycle_name is not null"
      - name: start_quarter
        tests: [not_null]
      - name: end_quarter
        tests: [not_null]
      - name: move_fraction
        tests: [not_null]
      - name: months
        tests: [not_null]

  - name: fct_deposit_beta
    description: >
      Cumulative deposit beta for every universe member in every study cycle, measured
      between the cost of deposits at the cycle's two ends against the policy move over the
      same quarters. The row carries the tier of each endpoint and the less precise of the
      two as the beta's own tier, so no comparison can mix tiers without showing it.
      Members with no beta keep their row. Which tiers and coverage a headline result
      requires is decided by the analysis, not here.
    columns:
      - name: cik
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'universe')
                field: cik
      - name: cycle_name
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [calibration, test]
      - name: measured_end_quarter
        description: >
          The cycle's end quarter, or the filer's last resolved quarter where its series
          ends inside the cycle.
        tests: [not_null]
      - name: partial_cycle
        description: The filer's series ends before the cycle peak and the beta runs to its last quarter.
        tests: [not_null]
      - name: metric_tier
        description: The less precise of the two endpoint tiers. Null where either endpoint is unresolved.
        tests:
          - accepted_values:
              arguments:
                values: ['1', '2', '3', 'X']
      - name: tier_changes_in_cycle
        description: More than one tier appears among the filer's quarters in the cycle.
        tests: [not_null]
      - name: deposit_beta
        description: Null where either endpoint is unresolved or at tier X.
      - name: cycle_quarters
        tests: [not_null]
      - name: material_event_in_cycle
        description: >
          A material acquisition or reverse acquisition by the filer completed in a quarter
          from the cycle's start to its measured end, so the deposit base changed between
          the two costs the beta compares.
        tests: [not_null]

  - name: bank_entity_events
    description: >
      Every entity event in the `entity_events` seed, with the quarter it falls in and the
      step it produced in the member's total deposits, from the quarter end before to the
      quarter end it completed in. An acquisition moving the base by a tenth or more is
      material, and one whose step cannot be measured is treated as material (decision
      0032).
    columns:
      - name: cik
        tests: [not_null]
      - name: event_quarter
        tests: [not_null]
      - name: event_type
        tests: [not_null]
      - name: material
        description: Null for exits and failures, which end a series rather than change it.

  - name: dim_bank
    description: >
      One row per universe member, with its place in the ranking, its SIC as a descriptive
      attribute only, the span of its periodic reports, and its exit where it has one. The
      exit comes from the event record, so every member that stopped filing carries the
      date, type and counterparty of its exit, as specification 4 requires of terminal
      filers.
    columns:
      - name: cik
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'universe')
                field: cik
      - name: registrant_name
        tests: [not_null]
      - name: last_filed_period
        description: Period of the member's last 10-K or 10-Q.
        tests: [not_null]
      - name: is_terminal
        tests: [not_null]
      - name: exit_type
        tests:
          - accepted_values:
              arguments:
                values: [exit_merger, exit_deregistration, failure]

  - name: fct_bank_quarter
    description: >
      One row per universe member and quarter end at which a cost of deposits or a deposit
      balance resolves: the cost with its tier and provenance, the deposit base, the policy
      rate, the study cycle the quarter falls in, and the entity event completing in the
      quarter. The bank explorer reads it. Exits and failures complete in the quarter after
      a member's last report, so they appear on dim_bank rather than here.
    columns:
      - name: cik
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bank')
                field: cik
      - name: quarter_end
        description: >
          The end of the filer's fiscal quarter. Discover's quarters to 2012 and Goldman
          Sachs's of 2009 end off the calendar quarter, 17 rows in all.
        tests: [not_null]
      - name: metric_tier
        tests:
          - accepted_values:
              arguments:
                values: ["1", "2", "3", "X"]
      - name: policy_rate_fraction
        description: >
          Quarterly average effective federal funds rate as a decimal fraction. Null for the
          17 fiscal quarters that do not end on a calendar quarter end.
      - name: cycle_name
        description: The study cycle whose window holds the quarter, null outside both.
        tests:
          - accepted_values:
              arguments:
                values: [calibration, test]
      - name: event_type
        tests:
          - accepted_values:
              arguments:
                values: [acquisition, reverse_acquisition]
      - name: material_event
        description: >
          Whether an acquisition that moved the deposit base by a tenth or more completed in
          the quarter (decision 0032). False, not null, where none did.
        tests: [not_null]
      - name: regulatory_cost_of_deposits
        description: >
          The cost of deposits of the filer's regulatory group, from its insured
          institutions' Call Reports by the metric's arithmetic. Null for a filer outside
          the pinned regulatory table and for quarters before 2009.
      - name: averaging_basis
        description: The basis the group's Call Report averages reconcile to, where they do.
        tests:
          - accepted_values:
              arguments:
                values: [interest_bearing, nontransaction]
      - name: averaging_error
        description: >
          The group's endpoint average against its reported average, less one, on its
          basis. Only in quarters the FFIEC archives hold, with the quarter before.

  - name: mart_cross_bank_comparison
    description: >
      One row per universe member: its cycle betas and tiers, the pre-registered samples it
      enters, and its rank, quartile and quartile shift within the headline sample, as the
      persistence analysis computes them through the library (decision 0042). Ranks run
      from 1, the slowest repricer, and are null outside the headline.
    columns:
      - name: cik
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bank')
                field: cik
      - name: in_headline
        tests: [not_null]
      - name: calibration_quartile
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
      - name: test_quartile
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
      - name: material_deviator
        description: Two or more quartiles apart between the cycles; null outside the headline.
