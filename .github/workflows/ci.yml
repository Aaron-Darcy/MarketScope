name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Pinned so a change of image is a reviewed commit rather than something that happens
    # to the build: ubuntu-latest moves to a new major release from 19 October 2026.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -m "not network" --cov=marketscope --cov-report=term-missing

      # Parses models, sources and tests without a warehouse, so a broken ref or a
      # malformed schema file fails here rather than on the next load.
      - name: dbt parse
        working-directory: transform/dbt
        run: dbt parse --profiles-dir .
