name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "data/site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      # The version the site was built and checked on, pinned so a newer Node is a reviewed
      # change rather than one that arrives unasked.
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      # Types, lint, formatting and tests, including the tests that read the committed
      # export in data/site/ and hold the pages' figures to it (decisions 0044 and 0046).
      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
